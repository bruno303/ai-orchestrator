# Model selection is independent for issue execution and pull-request review.
# Omit either section to use the selected provider's default model for that
# workflow. Codex maps variant to model_reasoning_effort; Claude exposes its
# variant through CLAUDE_CODE_EFFORT_LEVEL.
model:
  execution:
    name: openai/gpt-5.6-luna
    variant: medium
  review:
    name: openai/gpt-5.6-luna
    variant: medium
  triage:
    name: openai/gpt-5.6-luna
    variant: medium

logging:
  # quiet: errors and execution results; normal: summaries and commands;
  # verbose: detailed, identifier-rich polling diagnostics.
  verbosity: normal

# Providers for the current GitHub -> agent -> Git -> GitHub workflow.
# GitHub-facing and Git providers accept auth: bot (the default) or user.
# This sample uses a local user for execution and the GitHub App bot for review.
# Register new adapter types in main/providers.py before selecting them here.
# Change either executor type to codex or claude to use that CLI provider.
# Claude execution may set permission_mode (for example, acceptEdits); Claude
# review defaults to its read-only plan mode.
pipeline:
  # Every stage has a label contract. `select` is required, `suppress` wins
  # over selection, and output labels are applied only after publication.
  execution:
    input_source: {type: github_polling, auth: user}
    executor: {type: opencode}
    workspace_manager: {type: git, auth: user}
    destination: {type: github, auth: user}
    labels:
      select: [ai-agent]
      suppress: [ai-developed]
      output:
        add: [ai-developed]
    # These are the built-in default workflows. Keep them, edit them, or
    # remove a `workflow` section (or set it to `null`) to fall back to its
    # built-in sequence. A present `workflow` must be a mapping with a `steps`
    # list, or a bare list of step mappings; unknown workflow keys abort at
    # startup.
    # A configured workflow in any stage must contain a `publish` step; set
    # `require_publication: false` on the workflow mapping to opt out.
    # `publish` steps cannot use `on_failure: continue`.
    workflow:
      steps:
        - {name: prepare_workspace, type: checkout}
        - {name: plan, type: plan}
        - {name: implement, type: implement}
        - {name: create_pr, type: publish}
        - {name: cleanup, type: cleanup, on_failure: continue}
    # Comment commands (/ai-agent-impl and /ai-agent-discuss) have their own
    # workflows. Configuring one leaves the other on its built-in sequence:
    comments:
      impl:
        workflow:
          steps:
            - {name: checkout, type: checkout}
            - {name: implement, type: implement_comment}
            - {name: publish, type: publish}
            - {name: cleanup, type: cleanup, on_failure: continue}
      discuss:
        workflow:
          steps:
            - {name: checkout, type: checkout}
            - {name: answer, type: discuss}
            - {name: publish, type: publish}
  review:
    input_source: {type: github_polling, auth: bot}
    executor: {type: opencode}
    workspace_manager: {type: git, auth: bot}
    destination: {type: github, auth: bot}
    labels:
      select: []
      suppress: [ai-reviewed]
      output:
        add: [ai-reviewed]
    # Review cleanup stays a loop-owned finally epilogue, so the built-in
    # workflow does not include a cleanup step:
    workflow:
      steps:
        - {name: checkout, type: checkout}
        - {name: review, type: review}
        - {name: publish, type: publish}
  triage:
    input_source: {type: github_polling, auth: bot}
    executor: {type: opencode}
    destination: {type: github, auth: bot}
    labels:
      select: []
      suppress: [ai-agent, ai-triage, ai-developed]
      output:
        ready:
          add: [ai-agent]
          remove: [ai-triage]
        blocked:
          add: [ai-triage]
    # Triage assessment owns its temporary workspace; there is no cleanup step:
    workflow:
      steps:
        - {name: assess, type: assess}
        - {name: publish, type: publish}

# Repositories allowed to trigger the orchestrator.
# Only repos listed here can be processed (CLI, poll, and graph all enforce this).
#
# Optional per-repo option:
#   label: ai-agent   -> legacy no-op; stage labels are configured above
repositories:
  - name: bruno303/ai-tools
  - name: bruno303/study-topics
  - name: bruno303/planning-poker
    default_branch: main
  - name: bruno303/ai-orchestrator
    default_branch: main
