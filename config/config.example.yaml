# Model selection is independent for issue execution and pull-request review.
# Omit either section to use the selected provider's default model for that
# workflow. Codex maps variant to model_reasoning_effort; Claude exposes its
# variant through CLAUDE_CODE_EFFORT_LEVEL.
model:
  execution:
    name: openai/gpt-5.6-luna
    variant: medium
  review:
    name: openai/gpt-5.6-luna
    variant: medium
  triage:
    name: openai/gpt-5.6-luna
    variant: medium

# Providers for the current GitHub -> agent -> Git -> GitHub workflow.
# GitHub-facing and Git providers accept auth: bot (the default) or user.
# This sample uses a local user for execution and the GitHub App bot for review.
# Register new adapter types in main/providers.py before selecting them here.
# Change either executor type to codex or claude to use that CLI provider.
# Claude execution may set permission_mode (for example, acceptEdits); Claude
# review defaults to its read-only plan mode.
pipeline:
  # Every stage has a label contract. `select` is required, `suppress` wins
  # over selection, and output labels are applied only after publication.
  execution:
    input_source: {type: github_polling, auth: user}
    executor: {type: opencode}
    workspace_manager: {type: git, auth: user}
    destination: {type: github, auth: user}
    labels:
      select: [ai-agent]
      suppress: [ai-developed]
      output:
        add: [ai-developed]
  review:
    input_source: {type: github_polling, auth: bot}
    executor: {type: opencode}
    workspace_manager: {type: git, auth: bot}
    destination: {type: github, auth: bot}
    labels:
      select: []
      suppress: [ai-reviewed]
      output:
        add: [ai-reviewed]
  triage:
    input_source: {type: github_polling, auth: bot}
    executor: {type: opencode}
    destination: {type: github, auth: bot}
    labels:
      select: []
      suppress: [ai-agent, ai-triage, ai-developed]
      output:
        ready:
          add: [ai-agent]
          remove: [ai-triage]
        blocked:
          add: [ai-triage]

# Repositories allowed to trigger the orchestrator.
# Only repos listed here can be processed (CLI, poll, and graph all enforce this).
#
# Optional per-repo options:
#   label: ai-agent   -> legacy no-op; stage labels are configured above
#   command: /ai-agent -> comment prefix that triggers a re-run (default /ai-agent)
repositories:
  - name: bruno303/ai-tools
  - name: bruno303/study-topics
  - name: bruno303/planning-poker
    default_branch: main
  - name: bruno303/ai-orchestrator
    default_branch: main
