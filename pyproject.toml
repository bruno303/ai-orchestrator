[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "LangGraph orchestrator: GitHub Issues -> agent plan/build-with-validation -> PR"
readme = "README.md"
authors = [
    { name = "Bruno Oliveira", email = "brunooliveira812@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["orchestration", "github", "langgraph", "agents", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "langgraph>=1.2.11",
    "PyJWT[crypto]>=2.10.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
ai-orchestrator = "orchestrator.main.cli:main"

[project.urls]
Homepage = "https://github.com/bruno303/ai-orchestrator"
Source = "https://github.com/bruno303/ai-orchestrator"
Issues = "https://github.com/bruno303/ai-orchestrator/issues"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orchestrator"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
