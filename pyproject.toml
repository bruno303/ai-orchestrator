[project]
name = "orchestrator"
version = "0.1.0"
description = "LangGraph orchestrator: GitHub Issues -> agent plan/build -> tests -> PR"
readme = "README.md"
authors = [
    { name = "Bruno Oliveira", email = "brunooliveira812@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "PyJWT[crypto]>=2.10.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
orchestrator = "orchestrator.main.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
